[package]
name = "trait-gen"
description = "Trait implementation generator macro"
version = "2.0.8"
edition = "2021"
rust-version = "1.61.0"
authors = ["Redglyph"]
categories = ["rust-patterns"]
keywords = ["proc-macro", "macro", "trait", "generator"]
documentation = "https://docs.rs/trait-gen"
homepage = "https://codeberg.org/Redglyph/trait_gen"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/Redglyph/trait_gen"
readme = "README.md"
exclude = ["tests"]

[lib]
proc-macro = true

[features]
default = []
no_type_gen = []

[dependencies]
quote = "1.0.47"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "3.0.6", features = ["full", "visit-mut", "extra-traits"] }
proc-macro-error3 = "3.1.1"

[dev-dependencies]
trybuild = "1.0.121"
